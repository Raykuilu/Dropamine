name: Package and release

# BigWigs packager: builds a clean AddOns zip from a git tag, creates a GitHub
# Release, and (once CF_API_KEY + X-Curse-Project-ID are set) uploads to CurseForge.
# Nothing in this workflow runs until you push a tag — it does not publish on
# ordinary commits.
on:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 3.9.0 : une version cassée ne part jamais (ni GitHub ni CurseForge) : les tests passent d'abord
      - name: Lua 5.4
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - name: Run all checks
        run: LUA=lua LUAC=luac sh tests/run_all.sh

      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          args: -n "{package-name}-{project-version}:{package-name}-{project-version}"
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
